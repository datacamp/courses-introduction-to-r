description: >-
  在本门 R 语言入门课程中，你将掌握这门广泛应用的开源语言的基础知识，包括向量、因子、列表和数据框。通过本课程所学的编程技能，你将能够使用 R
  独立开展数据分析。全球有数百万 R 语言用户，使其成为统计学和数据科学领域的主流编程语言之一。立即开启你的编程之旅，开始学习 DataCamp
  最受欢迎的课程之一吧！


  你可以在右侧的“资源”部分找到课程术语表。

  如需获得 CPE 学分，你需要完成本课程，并在相应的评估测试中达到 70% 的分数。点击右侧的 CPE 学分提示即可进入评估。
