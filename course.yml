  Introduction to R.pdf: Course Glossary
description: >-
  इस R परिचय कोर्स में, आप इस व्यापक रूप से उपयोग होने वाली ओपन सोर्स लैंग्वेज
  की बुनियादी बातें सीखेंगे—जिनमें vectors, factors, lists, और data frames शामिल
  हैं। इस कोर्स से मिलने वाले कोडिंग स्किल्स के साथ, आप R में अपना खुद का data
  analysis करने के लिए तैयार होंगे। दुनिया भर में लाखों R यूज़र्स हैं, जो इसे
  statistics और data science में अग्रणी programming language के रूप में स्थापित
  करते हैं। आज ही DataCamp के सबसे लोकप्रिय कोर्सेज़ में से एक के साथ अपनी
  coding journey शुरू करें!


  कोर्स का glossary दाईं ओर resources सेक्शन में उपलब्ध है।

  CPE credits प्राप्त करने के लिए आपको कोर्स पूरा करना होगा और qualified
  assessment में 70% स्कोर हासिल करना होगा। दाईं ओर दिए गए CPE credits कॉलआउट पर
  क्लिक करके आप assessment तक नेविगेट कर सकते हैं।
