description: >-
  在這門 R 入門課程中，你將學會這個廣泛使用的開源語言的基礎，包括向量、因子、列表與資料框。完成本課程後，你將具備在 R
  中進行資料分析的程式技能。全球有數百萬名 R 使用者，使其成為統計與資料科學領域的主要程式語言之一。現在就從 DataCamp
  最受歡迎的課程之一開始你的程式之旅吧！


  課程名詞表位於右側的資源區。

  若要取得 CPE 學分，你需要完成課程並在合格評量中達到 70% 的分數。你可以點選右側的 CPE 學分提示前往評量。
