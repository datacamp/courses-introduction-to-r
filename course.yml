description: >-
  W tym kursie wprowadzającym do R opanujesz podstawy tego szeroko stosowanego
  języka open source&mdash;w tym wektory, czynniki, listy i ramki danych.
  Umiejętności, które zdobędziesz, pozwolą ci samodzielnie przeprowadzać analizy
  danych w R. R ma miliony użytkowników na całym świecie i jest jednym z
  czołowych języków programowania w statystyce i data science. Rozpocznij swoją
  przygodę z programowaniem w jednym z najpopularniejszych kursów DataCamp!


  Glosariusz kursu znajdziesz po prawej stronie, w sekcji zasobów.

  Aby uzyskać punkty CPE, musisz ukończyć kurs i zdobyć co najmniej 70% w
  kwalifikowanym teście. Do testu możesz przejść, klikając powiadomienie o
  punktach CPE po prawej stronie.
