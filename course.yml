description: >-
  I den här introduktionskursen i R lär du dig grunderna i detta populära open
  source-språk – bland annat vektorer, faktorer, listor och dataramar. Med de
  kodkunskaper du bygger upp i kursen är du redo att genomföra egna dataanalyser
  i R. Det finns miljontals R-användare världen över, vilket gör det till ett av
  de ledande programmeringsspråken inom statistik och datavetenskap. Börja din
  kodresa i en av DataCamps mest populära kurser redan idag!


  Kursens ordlista finns till höger i resurssektionen.

  För att få CPE-poäng behöver du slutföra kursen och nå ett resultat på 70 % på
  den kvalificerade utvärderingen. Du kan navigera till utvärderingen genom att
  klicka på CPE-poäng-länken till höger.
