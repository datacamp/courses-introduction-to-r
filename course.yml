  Introduction to R.pdf: Course Glossary
description: >-
  In deze introductiecursus R leer je de basis van deze veelgebruikte
  openbrontaal—zoals vectors, factors, lists en data frames. Met de
  codeervaardigheden die je in deze cursus opdoet, kun je zelf aan de slag met
  data-analyse in R. Wereldwijd zijn er miljoenen R-gebruikers, wat het een
  toonaangevende programmeertaal maakt in statistiek en data science. Begin
  vandaag nog aan je codeerreis met een van DataCamp's populairste cursussen!


  De cursusterminologie vind je rechts bij de sectie resources.

  Om CPE-credits te behalen, moet je de cursus afronden en minimaal 70% scoren
  op de gekwalificeerde toets. Je kunt naar de toets navigeren door rechts op de
  CPE-credits-vermelding te klikken.
