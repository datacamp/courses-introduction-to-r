  Introduction to R.pdf: Course Glossary
description: >-
  Dans ce cours d'introduction à R, vous maîtriserez les bases de ce langage
  libre largement utilisé — notamment les vecteurs, les facteurs, les listes et
  les tableaux de données. Avec les compétences en codage que vous développerez
  ici, vous serez prêt à réaliser vos propres analyses de données dans R. Des
  millions de personnes utilisent R partout dans le monde, ce qui en fait un
  langage de programmation incontournable en statistiques et en science des
  données. Lancez-vous dès aujourd'hui dans l'un des cours les plus populaires
  de DataCamp!


  Le glossaire du cours se trouve à droite, dans la section Ressources.

  Pour obtenir des crédits de FPC, vous devez terminer le cours et atteindre un
  score de 70 % à l'évaluation admissible. Vous pouvez accéder à l'évaluation en
  cliquant sur l'encadré relatif aux crédits de FPC à droite.
