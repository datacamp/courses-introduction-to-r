datasets:
  Introduction to R.pdf: Course Glossary
description: >-
  În acest curs de introducere în R, vei stăpâni elementele de bază ale acestui
  limbaj open source utilizat pe scară largă — inclusiv vectori, factori, liste
  și cadre de date. Cu abilitățile de programare pe care le vei dobândi, vei fi
  pregătit să realizezi propriile analize de date în R. Există milioane de
  utilizatori R în întreaga lume, ceea ce îl consacră ca unul dintre cele mai
  importante limbaje de programare în statistică și știința datelor. Începe-ți
  parcursul în programare cu unul dintre cele mai populare cursuri DataCamp!


  Glosarul cursului se găsește în dreapta, în secțiunea de resurse.

  Pentru a obține credite CPE, trebuie să finalizezi cursul și să obții un scor
  de 70% la evaluarea calificată. Poți accesa evaluarea făcând clic pe
  indicatorul de credite CPE din dreapta.
