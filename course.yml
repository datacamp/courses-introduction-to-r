datasets:
  Introduction to R.pdf: Course Glossary
description: >-
  V tomto úvodním kurzu R si osvojíš základy tohoto rozšířeného open source
  jazyka – včetně vektorů, faktorů, seznamů a datových rámců. S programátorskými
  dovednostmi, které zde získáš, budeš připraven/a na vlastní analýzu dat v R.
  Jazyk R má po celém světě miliony uživatelů a patří mezi přední programovací
  jazyky v oblasti statistiky a datové vědy. Vydej se na svou programátorskou
  cestu s jedním z nejoblíbenějších kurzů DataCampu!


  Glosář kurzu najdeš vpravo v sekci zdrojů.

  Pro získání kreditů CPE musíš kurz dokončit a dosáhnout skóre alespoň 70 % v
  příslušném hodnocení. K hodnocení se dostaneš kliknutím na upozornění týkající
  se kreditů CPE vpravo.
