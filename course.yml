datasets:
  Introduction to R.pdf: Course Glossary
description: >-
  この R 入門コースでは、広く使われているオープンソース言語 R の基礎を習得します。ベクトル、因子、リスト、データフレームなど、R
  の主要な概念を学びましょう。このコースで身につけたスキルを活かして、独自のデータ分析に取り組む準備が整います。R
  は世界中に数百万人のユーザーがおり、統計学とデータサイエンスの分野を代表するプログラミング言語のひとつです。DataCamp
  で人気の高いこのコースで、コーディングの第一歩を踏み出しましょう。


  コースの用語集は右側のリソースセクションからご確認いただけます。

  CPE 単位を取得するには、コースを修了し、認定評価で 70% 以上のスコアを獲得する必要があります。右側に表示されている CPE
  単位のバナーをクリックすると、評価画面に移動できます。
