  Introduction to R.pdf: Course Glossary
description: >-
  Dalam kursus pengantar R ini, Anda akan menguasai dasar-dasar bahasa open
  source yang banyak digunakan ini—termasuk vector, factor, list, dan data
  frame. Dengan keterampilan pengodean yang Anda peroleh di kursus ini, Anda
  akan siap melakukan analisis data sendiri di R. Ada jutaan pengguna R di
  seluruh dunia, menegaskan posisinya sebagai salah satu bahasa pemrograman
  terdepan dalam statistik dan data science. Mulai perjalanan ngoding Anda di
  salah satu kursus paling populer di DataCamp hari ini!


  Glosarium kursus dapat ditemukan di sebelah kanan pada bagian sumber daya.

  Untuk memperoleh kredit CPE, Anda harus menyelesaikan kursus dan mencapai skor
  70% pada asesmen yang memenuhi syarat. Anda dapat menuju ke asesmen dengan
  mengeklik pengumuman kredit CPE di sebelah kanan.
