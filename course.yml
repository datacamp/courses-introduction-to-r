description: "En este curso de introducción a R, dominarás los fundamentos de este lenguaje de código abierto ampliamente utilizado, incluidos vectores, factores, listas y marcos de datos. Con las habilidades de codificación que adquirirás en este curso, estarás preparado para emprender tus propios análisis de datos en R. Hay millones de usuarios de R en todo el mundo, lo que lo consolida como un lenguaje de programación líder en estadística y ciencia de datos. Comienza hoy mismo tu viaje por la programación en uno de los cursos más populares de DataCamp.\n\nEl glosario del curso se encuentra a la derecha, en la sección de recursos.\nPara obtener créditos CPE, debes completar el curso y alcanzar una puntuación del 70\_% en la evaluación cualificada. Puedes acceder a la evaluación haciendo clic en la llamada de créditos CPE situada a la derecha."
