datasets:
  Introduction to R.pdf: Course Glossary
description: >-
  В этом курсе вы освоите основы широко используемого языка программирования R с
  открытым исходным кодом: векторы, факторы, списки и фреймы данных. Полученные
  навыки позволят вам самостоятельно проводить анализ данных на R. Миллионы
  пользователей по всему миру сделали R одним из ведущих языков в статистике и
  науке о данных. Начните свой путь в программировании с одного из самых
  популярных курсов DataCamp!


  Глоссарий курса находится в разделе ресурсов справа.

  Чтобы получить кредиты CPE, необходимо пройти курс и набрать не менее 70% в
  квалификационном тесте. Перейти к тесту можно, нажав на ссылку с кредитами CPE
  справа.
