description: "In diesem Einführungskurs zu R lernst du die Grundlagen dieser weit verbreiteten Open-Source-Sprache kennen, einschließlich Vektoren, Faktoren, Listen und Dataframes. Mit den Programmierkenntnissen, die du in diesem Kurs erwirbst, kannst du künftig deine eigenen Datenanalysen in R durchführen. Weltweit wird R schon von Millionen genutzt\_– damit ist R eine der führenden Programmiersprachen für Statistik und Data Science. Starte jetzt diesen sehr beliebten Kurs von DataCamp!\n\nDas Kursglossar findest du rechts im Bereich Ressourcen.\nUm CPE-Credits zu erhalten, musst du den Kurs abschließen und in dem Test 70 % erreichen.  Du Assessment gelangst du, indem du rechts auf die Angabe zu den CPE-Credits klickst."
