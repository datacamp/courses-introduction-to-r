datasets:
  Introduction to R.pdf: Course Glossary
description: >-
  Trong khoá học Nhập môn Ngôn ngữ lập trình R, bạn sẽ học những kiến thức cơ
  bản của ngôn ngữ mã nguồn mở phổ biến này, bao gồm vectơ (vector), biến phân
  loại (factor), danh sách (list) và khung dữ liệu (data frame). Từ đó, bạn có
  thể tự phân tích dữ liệu bằng R. Hiện nay, có hàng triệu người dùng R, khẳng
  định vị thế của R là ngôn ngữ lập trình hàng đầu trong thống kê và khoa học dữ
  liệu. Hãy học lập trình với một trong những khóa học hấp dẫn nhất của DataCamp
  ngay hôm nay!


  Bảng thuật ngữ của khóa học nằm bên phải trong phần tài liệu.


  Để nhận tín chỉ CPE, bạn cần hoàn thành khóa học và đạt tối thiểu 70% trong
  bài đánh giá đủ điều kiện. Bạn có thể truy cập bài đánh giá bằng cách nhấp vào
  mục CPE credits ở bên phải.
