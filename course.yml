description: >-
  이 R 입문 과정에서는 벡터, 팩터, 리스트, 데이터 프레임 등 널리 쓰이는 오픈 소스 언어 R의 기본기를 익히게 됩니다. 이 코스에서 익힌
  코딩 실력으로 R에서 스스로 데이터 분석을 시작할 수 있어요. 전 세계 수백만 명이 R을 사용하며, 통계와 데이터 사이언스 분야의 대표적인
  프로그래밍 언어로 자리 잡았습니다. DataCamp에서 가장 인기 있는 코스 중 하나로 지금 코딩 여정을 시작해 보세요!


  코스 용어집은 오른쪽 리소스 섹션에서 확인하실 수 있어요.

  CPE 학점을 받으려면 코스를 완료하고 인증 평가에서 70% 이상을 취득해야 합니다. 오른쪽의 CPE 학점 안내를 클릭하면 평가로 이동할 수
  있어요.
