description: >-
  ในคอร์ส R เบื้องต้นนี้
  คุณจะได้เรียนรู้พื้นฐานของภาษาโปรแกรมโอเพนซอร์สยอดนิยมนี้ ครอบคลุมตั้งแต่
  vectors, factors, lists ไปจนถึง data frames เมื่อเรียนจบแล้ว
  คุณจะมีทักษะการเขียนโค้ดที่พร้อมนำไปวิเคราะห์ข้อมูลด้วย R ได้ด้วยตัวเอง
  ปัจจุบันมีผู้ใช้ R หลายล้านคนทั่วโลก ทำให้ R
  เป็นหนึ่งในภาษาโปรแกรมชั้นนำด้านสถิติและวิทยาศาสตร์ข้อมูล
  เริ่มต้นการเรียนรู้กับหนึ่งในคอร์สยอดนิยมของ DataCamp ได้เลย!


  ดูอภิธานศัพท์ของคอร์สได้ที่แถบทรัพยากรทางด้านขวา

  เพื่อรับหน่วย CPE credits จะต้องเรียนจบคอร์สและทำคะแนนได้ 70%
  ขึ้นไปในแบบทดสอบที่กำหนด สามารถไปยังแบบทดสอบได้โดยคลิกที่ส่วน CPE credits
  ทางด้านขวา
