description: >-
  이 R 입문 강의를 통해 벡터, 팩터, 리스트, 데이터 프레임 등 널리 사용되는 오픈 소스 언어 R의 기초를 완벽하게 익히실 수 있습니다.
  이 강의를 통해 습득한 코딩 역량을 바탕으로, 직접 데이터 분석을 수행할 수 있게 될 것입니다. 전 세계 수백만 명이 R을 사용하고 있으며,
  R은 통계 및 데이터 과학 분야에서 주요 프로그래밍 언어로 자리매김하고 있습니다. DataCamp에서 가장 인기 있는 과정 중 하나로 지금
  바로 코딩 여정을 시작해 보세요!


  강의 용어집은 우측 리소스 섹션에서 확인할 수 있습니다.

  CPE 학점을 취득하려면 강의를 완료하고 자격 평가에서 70% 이상의 점수를 받아야 합니다. 우측의 CPE 학점 안내를 클릭하여 평가
  페이지로 이동할 수 있습니다.
