description: >-
  在這門 R
  語言入門課程中，你將掌握這門廣泛使用的開放原始碼語言的基礎知識，包括向量（vector）、因子（factor）、清單（list）與資料框（data
  frame）。憑藉在本課程中獲得的程式設計技能，你將準備好使用 R 語言自行開展資料分析。全球有數以百萬計的 R
  語言使用者，使其成為統計與資料科學領域的主流程式語言之一。立即學習 DataCamp 最受歡迎的課程之一，開始你的程式設計之旅吧！


  課程術語表位於右側的資源區。

  若要取得 CPE 學分，你需要完成課程，並在合格測驗中達到 70% 的分數。點選右側的 CPE 學分提示，即可前往該測驗。
