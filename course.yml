description: >-
  У цьому курсі з R ви опanuєте основи цієї широко вживаної мови з відкритим
  кодом — зокрема вектори, фактори, списки та датафрейми. Завдяки навичкам
  кодування, які ви здобудете, ви зможете самостійно виконувати аналіз даних у
  R. Мільйони користувачів R у світі закріпили її як провідну мову програмування
  в статистиці та дата-сайєнсі. Почніть вивчення коду в одному з найпопулярніших
  курсів DataCamp уже сьогодні!


  Глосарій курсу розміщено праворуч у розділі ресурсів.

  Щоб отримати кредити CPE, потрібно завершити курс і набрати 70% на
  кваліфікаційному оцінюванні. Перейдіть до оцінювання, натиснувши на позначку
  про кредити CPE праворуч.
